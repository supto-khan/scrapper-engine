# Nexidant Opportunity Pricing & Valuation Matrix
# Version: 1.3.0
# Updated: 2026-08-18

version: "1.3.0"
currency: "USD"

# -----------------------------------------------------------------------------
# Quoting & Valuation Strategy Intent (Crucial Definition):
#
# 1. US Market Opportunity TAM (`estimated_value_low/high`):
#    - PURPOSE: Permanent internal-only TAM benchmark.
#    - USAGE: Strictly for lead scoring & prioritization in buying_score.py / Dashboard.
#    - RULE: NEVER directly quoted to prospects in cold outreach or sales proposals.
#
# 2. Established Offshore Rate (`offshore_established_quote_low/high`):
#    - PURPOSE: The long-term target pricing ceiling for Nexidiant as a mature agency (client #10+).
#    - RATE EQUIVALENT: $35 - $65/hr senior South Asian / Eastern European specialized rates.
#
# 3. New-Vendor Closing Range (`offshore_new_vendor_quote_low/high`):
#    - PURPOSE: Real-world initial closing range for first 5-10 clients and case study acquisition.
#    - RATE EQUIVALENT: $20 - $30/hr introductory rate.
#
# 4. Pilot Sprint Offer (`pilot_sprint_quote_low/high`):
#    - PURPOSE: 1 to 2 week low-friction proof-of-concept sprint to convert skeptical cold prospects.
# -----------------------------------------------------------------------------

active_positioning: "new_vendor_anchor_low"

positioning_profiles:
  new_vendor_anchor_low:
    description: "Introductory competitive anchor for rapid new client acquisition and case studies."
    quote_field: "offshore_new_vendor_quote"
    pitch_style: "audit_first_and_trial_sprint"
    recommended_cta: "Complimentary 15-minute architecture breakdown + 2-week risk-free trial sprint"

  pilot_sprint_intro:
    description: "Entry-level proof of concept fixed-fee sprint."
    quote_field: "pilot_sprint_quote"
    pitch_style: "low_friction_pilot"
    recommended_cta: "Fixed-scope pilot sprint to resolve your top bottleneck before full commitment"

  established_offshore:
    description: "Standard mature offshore agency rates (target for client #10 onward)."
    quote_field: "offshore_established_quote"
    pitch_style: "turnkey_specialist"
    recommended_cta: "Turnkey development sprint with senior engineering team"

